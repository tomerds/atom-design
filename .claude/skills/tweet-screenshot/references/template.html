<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #000000;
    --shot-radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); }

  /* full black canvas, the glass-ringed tweet centered with even padding */
  .canvas {
    position: relative;
    width: __CANVAS_W__px;
    height: __CANVAS_H__px;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* thick glass border: translucent white ring on black */
  .glass {
    display: inline-block;
    line-height: 0;
    padding: 12px;
    border-radius: 24px;
    background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.10));
    border: 1px solid rgba(255,255,255,0.28);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10);
  }

  /* the tweet itself, rounded and flat */
  .shot {
    display: block;
    width: __SHOT_W__px;
    height: auto;
    border-radius: var(--shot-radius);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glass"><img class="shot" src="__IMAGE_SRC__" alt=""></div>
  </div>
</body>
</html>
